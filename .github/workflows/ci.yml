name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show SQLite version (FTS5 trigram needs >= 3.34)
        run: python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
      - name: Editable install (validates packaging / entry points)
        run: pip install -e .
      - name: Byte-compile package + tests
        run: python -m compileall provenance tests
      - name: Validate public source boundary
        run: python tools/check_public_tree.py
      - name: Run unit + end-to-end tests
        run: python -m unittest discover -s tests -v

  extension:
    name: Browser exporter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate clean-room extension boundary
        run: python -B 01-capture/tests/test_extension.py

  windows-pull:
    name: Windows pull, research ingest, and context safety
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package and public entry points
        run: python -m pip install --no-deps .
      - name: Smoke public pull capability
        shell: pwsh
        run: |
          & prov-sync-pull --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & prov-sync-pending --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & prov-sync-fill --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & prov-sync-unresolved --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & prov-ingest-research --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $contextVersion = & prov-context --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($contextVersion -join "`n").Trim() -ne '0.18.0') {
            throw "Unexpected Context Capsule runtime version"
          }

          $raw = & prov-sync-pull --capabilities --json
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "prov-sync-pull capability probe exited $code" }

          $report = ($raw -join "`n") | ConvertFrom-Json
          if ($report.format_version -ne 1) { throw "Unexpected report format" }
          if ($report.operation -ne "pull.capabilities") { throw "Unexpected operation" }
          if ($report.status -ne "ok" -or $report.exit_code -ne 0) {
            throw "Capability probe did not report success"
          }
          if ($report.generated_by.name -ne "provenance") {
            throw "Unexpected capability producer"
          }
          if ($report.capabilities.pull_lock -ne $true) {
            throw "Pull lock capability is missing"
          }
          if ($report.capabilities.network_requests -ne $false) {
            throw "Public pull unexpectedly permits network requests"
          }
      - name: Run Windows sync-layer tests
        run: python -m unittest discover -s tests -p "test_synclayer_*.py" -v
      - name: Run Windows research context tests
        run: >-
          python -m unittest
          tests.test_research_artifacts
          tests.test_context_capsule
          tests.test_provenance.TestVaultIngest
          -v
